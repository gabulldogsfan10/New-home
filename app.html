@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function starterDocs(){
  return STARTER.map((s,i)=>{
    const [id,kind,title,room,pri="movein",est=0,notes="",due="",approx=false]=s;
    return {id,data:{kind,title,room,pri,est,cost:0,status:"todo",who:"Either",notes,link:"",due,approx,order:i,created:Date.now()}};

/* ---------- state ---------- */
let items = new Map();          // id -> data
let mode = "pending";           // "db" | "local" | "pending"
let dbRef = null;
let tab = "buy";
const filt = {q:"",who:"",status:""};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$"+Math.round(n||0).toLocaleString("en-US");

/* ---------- storage ---------- */
const LS_KEY = "newhome-2414-items";
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(Object.fromEntries(items))); }catch(e){} }
function startLocal(why){
  mode = "local";
  const saved = lsLoad();
  items = new Map();
  if(saved && Object.keys(saved).length){ for(const k in saved) items.set(k,saved[k]); }
  else { starterDocs().forEach(d=>items.set(d.id,d.data)); lsSave(); }
  setSync("local", why||"Saved on this device only");
  render();
}
function setSync(kind,text){ const s=$("sync"); s.className="sync "+kind; s.textContent=text; s.title = kind==="local" ? "Changes here won't show up on the other phone." : "Changes sync between both of you."; }

async function writeItem(id,data){
  items.set(id,data); render();
  if(mode==="db"){ try{ await dbRef.collection("items").doc(id).set(data); }catch(e){ toast("Couldn't save. Check your connection and try again."); } }
  else lsSave();
}
async function removeItem(id){
  items.delete(id); render();
  if(mode==="db"){ try{ await dbRef.collection("items").doc(id).delete(); }catch(e){ toast("Couldn't delete. Try again."); } }
  else lsSave();
}
async function loadStarter(){
  const docs = starterDocs();
  for(const d of docs){ await writeItem(d.id,d.data); }
  toast("Starter list added");
}

function boot(){
  const c = window.claude;
  if(!c || typeof c.use!=="function"){ startLocal(); return; }
  let settled=false;
  const timer=setTimeout(()=>{ if(!settled){ settled=true; startLocal("Offline · this device only"); } },10000);
  c.use("db").then(db=>{
    if(settled) return;
    if(!db){ settled=true; clearTimeout(timer); startLocal("Sign in to sync"); return; }
    dbRef=db;
    db.collection("items").onSnapshot(snap=>{
      if(!settled){ settled=true; clearTimeout(timer); }
      mode="db"; setSync("live","Synced");
      items=new Map(); snap.docs.forEach(d=>items.set(d.id,d.data()));
      render();
    }, err=>{ if(!settled){ settled=true; clearTimeout(timer); startLocal("Offline · this device only"); } else setSync("local","Sync paused"); });
  }).catch(()=>{ if(!settled){ settled=true; clearTimeout(timer); startLocal(); } });
}

/* ---------- derived ---------- */
function daysTo(d){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/864e5); }
function parseDay(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDay(s){ const d=parseDay(s); return d? d.toLocaleDateString("en-US",{month:"short",day:"numeric"}) : ""; }
function all(kind){ return [...items.entries()].filter(([,v])=>v.kind===kind); }

function renderStats(){
  const d=daysTo(CLOSING);
  $("sDays").textContent = d>1? d+" days" : d===1? "Tomorrow" : d===0? "Today!" : "Closed";
  const buy=all("buy"), need=buy.filter(([,v])=>v.status!=="done");
  $("sNeed").textContent=need.length;
  $("sNeedSub").textContent = need.filter(([,v])=>v.pri==="movein").length+" needed before move-in";
  const left=need.reduce((a,[,v])=>a+(+v.est||0),0);
  const spent=buy.filter(([,v])=>v.status!=="todo").reduce((a,[,v])=>a+(+v.cost||+v.est||0),0);
  $("sBudget").textContent=money(left); $("sSpent").textContent="spent "+money(spent);
  const t=all("task"), done=t.filter(([,v])=>v.status==="done").length;
  $("sTasks").textContent=done+"/"+t.length;
  $("sMeter").style.width = t.length? (done/t.length*100)+"%" : "0";
  $("cBuy").textContent=need.length;
  $("cStays").textContent=all("stays").filter(([,v])=>v.status!=="done").length;
  $("cTask").textContent=t.length-done;
}

function rowHTML(id,v){
  const kind=v.kind, st=v.status||"todo";
  const pills=[];
  if(kind==="buy"){
    if(v.pri==="movein" && st!=="done") pills.push('<span class="pill movein">Before move-in</span>');
    if(st==="ordered") pills.push('<span class="pill ordered">Ordered</span>');
  }
  if(kind==="task" && v.due){
    const dd=daysTo(parseDay(v.due));
    const cls = st==="done"?"": dd<0?"late": dd<=3?"soon":"";
    pills.push(`<span class="pill ${cls}">${v.approx?"≈ ":""}${esc(fmtDay(v.due))}${st!=="done"&&dd<0?" · overdue":""}</span>`);
  }
  if(v.who && v.who!=="Either") pills.push(`<span class="pill">${esc(v.who)}</span>`);
  const price = kind==="buy" ? money(st==="todo"? v.est : (v.cost||v.est)) : (kind==="task" && v.est? money(v.est):"");
  const note = v.notes? `<span>${esc(v.notes.length>90? v.notes.slice(0,88)+"…" : v.notes)}</span>`:"";
  const label = kind==="buy"? (st==="todo"?"Mark ordered":st==="ordered"?"Mark got it":"Mark still needed") : (st==="done"?"Uncheck":"Check off");
  return `<li class="row ${st}" data-id="${esc(id)}">
    <button class="tick" data-act="tick" aria-label="${label}: ${esc(v.title)}"><svg viewBox="0 0 16 16" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button>
    <div class="what" data-act="edit" role="button" tabindex="0"><b>${esc(v.title)}</b>${(pills.length||note)?`<div class="meta">${pills.join("")}${note}</div>`:""}</div>
    <div class="price">${price}</div></li>`;
}

function render(){
  renderStats();
  document.querySelectorAll(".tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.tab===tab?"page":"false"));
  $("intro").textContent=INTRO[tab];
  $("addForm").hidden = $("toolbar").hidden = tab==="plan";
  if(tab==="plan"){
    if(mode==="pending"){ $("out").innerHTML='<div class="empty">Loading your list…</div>'; return; }
    $("out").innerHTML=planHTML(); return;
  }
  const kind=KIND_OF_TAB[tab];
  // status chips
  $("fStatus").innerHTML = STATUS[kind].map(([k,l])=>`<button type="button" class="chip" data-st="${k}" aria-pressed="${filt.status===k}">${l}</button>`).join("");
  $("addPri").innerHTML = PRI[kind].map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  $("addPri").hidden = kind==="stays";
  $("addTitle").placeholder = kind==="buy"?"Add something to buy…":kind==="stays"?"Add an item the seller is leaving…":"Add a step…";

  const out=$("out");
  if(mode==="pending"){ out.innerHTML='<div class="empty">Loading your list…</div>'; return; }
  if(items.size===0){
    out.innerHTML=`<div class="empty"><b>Your list is empty.</b><span>Add your first item above, or load the starter list built from your contract and the seller's fixtures checklist.</span><button class="btn" id="starterBtn" type="button">Load starter list</button></div>`;
    return;
  }
  const q=filt.q.trim().toLowerCase();
  let rows=all(kind).filter(([,v])=>
    (!filt.status || (v.status||"todo")===filt.status) &&
    (!filt.who || v.who===filt.who) &&
    (!q || (v.title+" "+v.notes+" "+v.room).toLowerCase().includes(q)));
  if(!rows.length){ out.innerHTML='<div class="empty">Nothing matches these filters.</div>'; return; }

  let html="";
  if(kind==="task"){
    rows.sort((a,b)=>((a[1].status==="done")-(b[1].status==="done")) || String(a[1].due||"9").localeCompare(String(b[1].due||"9")));
    const groups=[["movein","Before closing"],["soon","Closing week"],["later","After closing"]];
    html = keyFacts() + groups.map(([k,l])=>{
      const g=rows.filter(([,v])=>v.pri===k); if(!g.length) return "";
      return `<section class="group"><h3>${l}<span>${g.filter(([,v])=>v.status==="done").length}/${g.length} done</span></h3><ul class="list">${g.map(([id,v])=>rowHTML(id,v)).join("")}</ul></section>`;
    }).join("");
  } else {
    const byRoom=new Map();
    rows.sort((a,b)=>(a[1].order??1e9)-(b[1].order??1e9) || (a[1].created||0)-(b[1].created||0));
    rows.forEach(r=>{ const k=r[1].room||"Other"; if(!byRoom.has(k)) byRoom.set(k,[]); byRoom.get(k).push(r); });
    const order=[...ROOMS,...[...byRoom.keys()].filter(k=>!ROOMS.includes(k))];
    html = (kind==="stays"? `<div class="note"><b>Not on the list, so the seller can take it:</b> refrigerator, washer/dryer, porch swing, grill, fire pit, outdoor furniture, TV mounts, window screens, kitchen café shutters. Range/cooktop and vent hood are also blank, so confirm the stove. Repairs listed by seller: none.</div>`:"") +
      order.filter(k=>byRoom.has(k)).map(k=>{
        const g=byRoom.get(k);
        const sub = kind==="buy" ? money(g.filter(([,v])=>v.status!=="done").reduce((a,[,v])=>a+(+v.est||0),0))+" left" : g.filter(([,v])=>v.status==="done").length+"/"+g.length+" confirmed";
        return `<section class="group"><h3><div>${esc(k)}${ROOM_SIZE[k]?`<small class="size">${ROOM_SIZE[k]}</small>`:""}</div><span>${sub}</span></h3><ul class="list">${g.map(([id,v])=>rowHTML(id,v)).join("")}</ul></section>`;
      }).join("");
  }
  out.innerHTML=`<div style="display:grid;gap:18px">${html}</div>`;
}

function keyFacts(){
  const f=[["Price","$245,000"],["Seller pays toward costs","$10,000"],["Earnest money","$2,500"],["Due diligence","10 days"],["Closing attorney","Nick Stutzman"],["Our agent","Scott Livingston, KW River Cities"]];
  return `<div class="keyfacts">${f.map(([a,b])=>`<div class="kf"><span>${a}</span><b>${esc(b)}</b></div>`).join("")}</div>`;
}

let selRoom = "Kitchen";
function roomStats(room){
  const r=[...items.entries()].filter(([,v])=>v.room===room);
  const buy=r.filter(([,v])=>v.kind==="buy"), stays=r.filter(([,v])=>v.kind==="stays"), task=r.filter(([,v])=>v.kind==="task");
  const needOpen=buy.filter(([,v])=>v.status!=="done");
  const urgent=needOpen.some(([,v])=>v.pri==="movein") || task.some(([,v])=>v.status!=="done"&&v.pri==="movein");
  const open=needOpen.length + task.filter(([,v])=>v.status!=="done").length;
  const unconfirmed=stays.some(([,v])=>v.status!=="done");
  const cls = !r.length? "" : urgent? "need" : (open||unconfirmed)? "some" : "ok";
  return {r,buy,stays,task,needOpen,open,cls,left:needOpen.reduce((a,[,v])=>a+(+v.est||0),0)};
}
function planSVG(){
  const g=PLAN.map(p=>{
    const s=roomStats(p.room), n=s.needOpen.length+s.task.filter(([,v])=>v.status!=="done").length;
    const name=p.label||p.room, size=ROOM_SIZE[p.room]||"";
    const lbl = `${name}: ${s.needOpen.length} to get, ${s.stays.length} staying`;
    return `<g class="rm ${s.cls}${p.out?" out":""}${selRoom===p.room?" sel":""}" data-room="${esc(p.room)}" tabindex="0" role="button" aria-label="${esc(lbl)}" aria-pressed="${selRoom===p.room}">
      <path d="${p.d}" fill-rule="nonzero"/>
      <text x="${p.x}" y="${p.y}" class="${p.small?"sm":""}">${esc(name)}</text>
      ${!p.small&&size?`<text x="${p.x}" y="${p.y+18}" class="dim">${esc(size.replace(/^deck /,""))}</text>`:""}
      ${n?`<g class="badge"><circle cx="${p.x}" cy="${p.y-(p.small?22:30)}" r="12"/><text x="${p.x}" y="${p.y-(p.small?18:26)}">${n}</text></g>`:""}
    </g>`;}).join("");
  return `<svg class="plan-svg" viewBox="0 0 515 1205" role="group" aria-label="Floor plan of 2414 19th Ave. Choose a room.">${g}
    <text x="426" y="172" class="dim">not to scale</text>
    <path d="M241 1200 l-8 -10 h16 z" class="entry"/></svg>`;
}
function roomPanel(){

  const ord=(a,b)=>(a[1].order??1e9)-(b[1].order??1e9);

    <div><div class="eyebrow">Room</div><h2>${esc(title)}</h2>${ROOM_SIZE[selRoom]?`<div class="sub">${esc(ROOM_SIZE[selRoom])}</div>`:""}
      <div class="mini" style="margin-top:8px"><span class="pill ${s.needOpen.length?"movein":""}">${s.needOpen.length} to get · ${money(s.left)}</span><span class="pill">${s.stays.filter(([,v])=>v.status==="done").length}/${s.stays.length} staying confirmed</span>${tasks.length?`<span class="pill soon">${tasks.length} open question${tasks.length>1?"s":""}</span>`:""}</div></div>

function planHTML(){

      ${v.kind==="buy"?`<label>Estimate ($)<input id="eEst" type="number" min="0" step="1" inputmode="decimal" value="${+v.est||""}"></label>
      <label>Actual paid ($)<input id="eCost" type="number" min="0" step="1" inputmode="decimal" value="${+v.cost||""}"></label>
      <label class="full">Link to product<input id="eLink" type="url" placeholder="https://" value="${esc(v.link)}"></label>`:""}
      ${v.kind==="task"?`<label>Due date<input id="eDue" type="date" value="${esc(v.due)}"></label>`:""}
      <label class="full">Notes<textarea id="eNotes">${esc(v.notes)}</textarea></label>
      ${v.link?`<a class="full" href="${esc(v.link)}" target="_blank" rel="noopener">Open product link ↗</a>`:""}
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="eDel">Delete</button>
      <div><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save</button></div>
    </div>
  </form>`;
  host.hidden=false; $("eTitle").focus();
  const close=()=>{host.hidden=true;host.innerHTML="";};
  host.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",close));
  host.onkeydown=e=>{ if(e.key==="Escape") close(); };
  let armed=false;
  $("eDel").addEventListener("click",()=>{
    if(!armed){ armed=true; $("eDel").textContent="Tap again to delete"; return; }
    removeItem(id); close(); toast("Deleted");
  });
  $("sheet").addEventListener("submit",e=>{
    e.preventDefault();
    const g=k=>{const el=$(k); return el? el.value : undefined;};
    const nv={...v,title:g("eTitle").trim()||v.title,room:g("eRoom"),status:g("eStatus"),who:g("eWho"),notes:g("eNotes")};
    if(g("ePri")!==undefined) nv.pri=g("ePri");
    if(v.kind==="buy"){ nv.est=+g("eEst")||0; nv.cost=+g("eCost")||0; nv.link=g("eLink").trim(); }
    if(v.kind==="task"){ if(g("eDue")!==v.due) nv.approx=false; nv.due=g("eDue"); }
    writeItem(id,nv); close(); toast("Saved");
  });
}

let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1800); }

setTab();
boot();
})();
</script>
